services:
  backend:
    build: ./backend
    container_name: office-app-backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    env_file:
      - ./backend/.env
    volumes:
      # Mount the Google service account key as a secret file instead of baking it into the image.
      - ./backend/secrets:/app/secrets:ro

  frontend:
    build: ./frontend
    container_name: office-app-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - backend
    # Note: VITE_API_BASE_URL is baked in at build time (Vite convention), so
    # frontend/.env must be set correctly (host LAN IP) BEFORE `docker compose build`.
    # Changing it later requires a rebuild, not just a restart.
